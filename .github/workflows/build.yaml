name: unit

on: 
    push:
        branches:
            - main
    pull_request:
        branches:
         - main

jobs:

    build:

        runs-on: ubuntu-latest

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            
            - name: install dependences
              run: pip install -r requirements.txt
            
            - name: execute tests
              run: |
               python -m tests.main unit
               python -m tests.main integration
               python -m tests.main functional
